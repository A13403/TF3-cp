<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TF三代 CP Top5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<style>
:root{--bk:#020202;--rd:#e00419;--cr:#ffefcc;--gold:#f4c34a;--sub:rgba(255,239,204,.62);--ln:rgba(224,4,25,.55);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bk);color:var(--cr);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
em{font-family:"Playfair Display","Times New Roman",Georgia,serif;font-style:italic;font-weight:600}
h1{font-size:40px;line-height:1.1;margin:10px 0 12px;font-weight:700;letter-spacing:.01em}
h1 em{color:var(--rd);font-size:1.25em}
#result h1{font-size:30px}
p.sub{color:var(--sub);margin:0 0 6px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cr);outline-offset:2px}
.band{margin:20px -16px;padding:18px 16px}
.band.red{background:var(--rd);color:var(--cr)}
.band.cream{background:var(--cr);color:#1a1a1a}
.band p{margin:0}
.names{font-size:17px;line-height:1.95;font-family:"Noto Serif SC","Songti SC","STSong",serif}
.names i{font-style:normal;opacity:.6;margin:0 5px}
.band.cream p{font-size:14.5px;line-height:1.75}
.band.cream b{color:var(--rd)}
.ar{width:18px;height:18px;color:var(--rd);flex:none}
.inl{display:inline-block;vertical-align:-4px;margin-right:6px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;min-height:120px;text-align:left;padding:12px;background:var(--bk);border:1px solid var(--rd);border-radius:8px;transition:background .15s}
.size:active{background:var(--rd)}
.size .nm{font-size:14px;color:var(--sub)}
.size .num{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:34px;line-height:1;color:var(--cr);text-align:right}
.size .num small{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-style:normal;font-size:12px;margin-left:2px;color:var(--sub)}
.size .ds{grid-column:1;grid-row:3;align-self:end;font-size:12px;color:var(--sub);line-height:1.4}
.size .ar{grid-column:2;grid-row:3;align-self:end}
.bar{height:3px;background:rgba(255,239,204,.16);margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--rd);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.stage{font-size:18px;font-weight:700;margin:14px 0 2px}
.hint{color:var(--sub);font-size:13px;margin:0}
.duel{display:grid;gap:6px;margin:14px 0}
.opt{background:var(--cr);color:#1a1a1a;border:0;border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s,box-shadow .12s}
.opt:active{transform:scale(.98);box-shadow:0 0 0 2px var(--rd)}
.opt .n{font-size:18px;font-weight:700}
.opt .x,.champ .x{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--rd);font-size:20px;margin:0 4px}
.imgs{display:flex;justify-content:center;align-items:center;gap:8px}
.ph{height:clamp(130px,24vh,190px);width:auto;border-radius:4px;background:#222;display:block}
.vs{justify-self:center;width:30px;height:30px;margin:-4px 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:12px;color:var(--cr);background:var(--rd);z-index:1;box-shadow:0 0 0 3px var(--bk)}
.ghost{background:none;border:1px solid var(--rd);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--cr)}
.ghost:active{background:var(--rd)}
.ghost:disabled{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap}
.slots{border:1px solid var(--rd);border-radius:8px;padding:4px 14px;margin-top:18px}
.slot{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--ln)}
.slot:last-child{border-bottom:0}
.slot b{width:36px;color:var(--rd);white-space:nowrap;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:16px}
.slot b.t1{font-size:20px;color:var(--cr)}
.slot.empty{color:var(--sub)}
.slot span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.th{height:34px;width:auto;border-radius:3px;display:block;flex:none}
.crown{width:1.05em;height:1.05em;fill:var(--gold);vertical-align:-.12em;margin-left:4px}
.champ{position:relative;background:var(--rd);color:var(--cr);border-radius:10px;padding:26px 12px 22px;text-align:center;margin:14px 0}
.champ small{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:28px;color:var(--cr)}
.champ .n{font-size:24px;font-weight:800;margin-top:8px;white-space:nowrap}
.champ .x{color:var(--cr);opacity:.75;font-size:24px;margin:0 8px}
.champ .ph{height:clamp(150px,28vh,220px);border:2px solid var(--cr);border-radius:4px}
.orn{position:absolute;fill:var(--cr)}
.orn.tl{top:12px;left:14px;width:14px;height:14px}
.orn.tr{top:16px;right:18px;width:9px;height:9px;opacity:.7}
.orn.bl{bottom:14px;left:16px;width:11px;height:11px;opacity:.7}
.orn.br{bottom:12px;right:14px;width:14px;height:14px}
.ic{width:13px;height:13px;fill:var(--rd);margin-right:6px;vertical-align:-1px}
.note{color:var(--sub);font-size:12.5px;margin-top:22px}
.how{list-style:none;margin:0;padding:0}
.how li{display:flex;gap:10px;font-size:15px;line-height:1.65;padding:9px 0;border-bottom:1px solid rgba(224,4,25,.3)}
.how li:first-child{padding-top:0}
.how li:last-child{border-bottom:0;padding-bottom:0}
.how .ar{width:16px;height:16px;margin-top:4px}
.pr{white-space:nowrap;font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="st" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></symbol><symbol id="ht" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></symbol><symbol id="ar" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol></defs></svg>
<main>
<section id="home">
  <h1>TF三代<br>CP <em>Top5</em></h1>
  <p class="sub">两两对决,多轮重组。每一次选择都会缩小范围,直到你的五组偏爱依次落位。</p>
  <div class="band red"><p class="names">朱志鑫<i>/</i>张泽禹<i>/</i>张极<i>/</i>左航<i>/</i>苏新皓<i>/</i>童禹坤<i>/</i>邓佳鑫<i>/</i>穆祉丞<i>/</i>张子墨<i>/</i>黄朔<i>/</i>张峻豪<i>/</i>余宇涵</p></div>
  <div class="band cream"><ul class="how"><li><svg class="ar"><use href="#ar"/></svg><span>12位成员两两配对,共 <b>132</b> 组</span></li><li><svg class="ar"><use href="#ar"/></svg><span>左右有意义</span></li><li><svg class="ar"><use href="#ar"/></svg><span>每次二选一,先选出你的 <b>第1位</b></span></li><li><svg class="ar"><use href="#ar"/></svg><span>接着只在输给它的几组里再选,依次选到 <b>第5位</b></span></li></ul></div>
  <div class="sizes">
    <button class="size" data-n="16"><span class="nm">快速版</span><span class="num">16<small>组</small></span><span class="ds">随机抽取<br>约28次选择</span><svg class="ar"><use href="#ar"/></svg></button>
    <button class="size" data-n="32"><span class="nm">标准版</span><span class="num">32<small>组</small></span><span class="ds">随机抽取<br>约48次选择</span><svg class="ar"><use href="#ar"/></svg></button>
    <button class="size" data-n="64"><span class="nm">加长版</span><span class="num">64<small>组</small></span><span class="ds">随机抽取<br>约90次选择</span><svg class="ar"><use href="#ar"/></svg></button>
    <button class="size" data-n="132"><span class="nm">完整版</span><span class="num">132<small>组</small></span><span class="ds">全部组合上场<br>约160次选择</span><svg class="ar"><use href="#ar"/></svg></button>
  </div>
</section>

<section id="play" class="hide">
  <div class="meta"><span id="prog"></span><span id="cnt"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="stage" id="stage"></div>
  <p class="hint" id="hint"></p>
  <div class="duel" id="duel"></div>
  <div class="row">
    <button class="ghost" id="undo">上一步</button>
    <button class="ghost" id="quit">重新开始</button>
  </div>
  <div class="slots" id="slots"></div>
</section>

<section id="result" class="hide">
  <h1>你的 <em>Top5</em></h1>
  <div class="champ"><svg class="orn tl"><use href="#st"/></svg><svg class="orn tr"><use href="#st"/></svg><svg class="orn bl"><use href="#ht"/></svg><svg class="orn br"><use href="#st"/></svg><small>Top 1<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l4.5 4.5L12 4l4.5 7.5L21 7l-2 12H5z"/></svg></small><div class="n" id="champ"></div></div>
  <div class="slots" id="rest" style="margin-top:0"></div>
  <div class="row" style="margin-top:14px">
    <button class="ghost" id="copy">复制结果</button>
    <button class="ghost" id="again">再玩一次</button>
  </div>
  <p class="note" id="copied"></p>
</section>
</main>

let S=null,hist=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["home","play","result"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(n){
  const ids=shuffle(ALL.map((_,i)=>i)).slice(0,n);
  S={round:ids,next:[],i:0,ranked:[],beat:{},cache:{},stageSize:n,done:0};
  hist=[];show("play");advance();
}
function stageName(len){return len===2?"决赛":len===4?"四强":len+"强"}
function place(w){
  S.ranked.push(w);
  if(S.ranked.length>=TOP)return;
  const set=new Set();
  S.ranked.forEach(x=>(S.beat[x]||[]).forEach(y=>{if(!S.ranked.includes(y))set.add(y)}));
  S.round=shuffle([...set]);S.next=[];S.i=0;S.stageSize=S.round.length;
}
function advance(){
  for(;;){
    if(S.round.length===1){place(S.round[0]);if(S.ranked.length>=TOP){finish();return}continue}
    const r=S.round;
    if(S.i*2>=r.length-1){
      if(S.i*2===r.length-1)S.next.push(r[S.i*2]);
      S.round=S.next;S.next=[];S.i=0;continue;
    }
    const a=r[S.i*2],b=r[S.i*2+1],w=S.cache[key(a,b)];
    if(w!==undefined){S.next.push(w);S.i++;continue}
    render();return;
  }
}
function render(){
  const r=S.round,a=r[S.i*2],b=r[S.i*2+1],k=S.ranked.length+1;
  $("stage").innerHTML='<svg class="ic"><use href="#st"/></svg>'+"争第 "+k+" 位 · "+stageName(r.length);
  $("hint").textContent=k===1?"从参赛组合里选出你最偏爱的":"只有输给你已选出组合的几组,重新对决";
  const left=r.length-S.i,fr=S.stageSize>1?(S.stageSize-left)/(S.stageSize-1):1;
  $("prog").textContent="第 "+(S.i+1)+" / "+Math.floor(r.length/2)+" 场";
  $("cnt").textContent="已选 "+S.done+" 次";
  $("fill").style.width=((S.ranked.length+Math.max(0,Math.min(1,fr)))/TOP*100)+"%";
  $("duel").innerHTML="";
  [a,b].forEach((p,j)=>{
    const o=document.createElement("button");o.className="opt";
    o.innerHTML='<div class="imgs">'+imgs(p,"ph")+'</div><div class="n">'+ALL[p][0]+' <span class="x">×</span> '+ALL[p][1]+'</div>';
    o.onclick=()=>pick(j);$("duel").appendChild(o);if(j===0){const v=document.createElement("div");v.className="vs";v.textContent="VS";$("duel").appendChild(v)}
  });
  let h="";
  for(let n=0;n<TOP;n++){
    const id=S.ranked[n];
    h+='<div class="slot'+(id===undefined?' empty':'')+'"><b'+(n===0?' class="t1"':'')+'>'+(n+1)+(n===0?CROWN:'')+'</b><span>'+(id===undefined?'待决出':imgs(id,"th")+'<span>'+nm(id)+'</span>')+'</span></div>';
  }
  $("slots").innerHTML=h;
  $("undo").disabled=!hist.length;
}
function pick(j){
  hist.push(JSON.stringify(S));
  const r=S.round,a=r[S.i*2],b=r[S.i*2+1],w=j?b:a,l=j?a:b;
  (S.beat[w]=S.beat[w]||[]).push(l);
  S.cache[key(a,b)]=w;
  S.done++;S.next.push(w);S.i++;
  advance();
}
function finish(){
  show("result");
  const c=ALL[S.ranked[0]];
  $("champ").innerHTML='<div class="imgs">'+imgs(S.ranked[0],"ph")+'</div><div>'+c[0]+'<span class="x">×</span>'+c[1]+'</div>';
  $("rest").innerHTML=S.ranked.slice(1).map((id,n)=>'<div class="slot"><b>'+(n+2)+'</b><span>'+imgs(id,"th")+'<span>'+nm(id)+'</span></span></div>').join("");
  $("copied").textContent="";
}
$("undo").onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());render()}};
$("quit").onclick=()=>show("home");
$("again").onclick=()=>show("home");
$("copy").onclick=async()=>{
  const t="我的TF三代CP Top5:\n"+S.ranked.map((id,n)=>(n+1)+". "+nm(id)).join("\n");
  try{await navigator.clipboard.writeText(t);$("copied").textContent="已复制,可以直接发给朋友。"}
  catch(e){$("copied").textContent=t}
};
document.querySelectorAll(".size").forEach(b=>b.onclick=()=>start(+b.dataset.n));
</script>
</body>
</html>
